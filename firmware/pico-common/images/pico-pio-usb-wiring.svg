<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">Pico 1 and Pico 2 single-port PIO USB keyboard and mouse wiring</title>
<desc id="desc">The AnyKVM server powers the Pico through its built-in Micro-USB port and sends CDC serial commands. GPIO12, physical pin 16, connects through 27 ohms to USB-B pin 3 D plus. GPIO13, physical pin 17, connects through 27 ohms to USB-B pin 2 D minus. A 1.5 kiloohm resistor connects USB D plus, after the series resistor, to Pico 3V3 OUT physical pin 36. Pico GND physical pin 18 connects to USB-B pin 4. USB-B VBUS pin 1 is not connected. The target computer connects to the USB-B breakout using a standard USB-A to USB-B cable. Fixed-pull-up bench circuit: target USB power must remain present; no VBUS sensing or power-off isolation is shown.</desc>
