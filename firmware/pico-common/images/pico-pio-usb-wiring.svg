<text x="625" y="850" font-size="23" fill="#172b3a" font-weight="700" text-anchor="start">Connection and power notes</text>
<text x="625" y="890" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">1. Native USB is separate from GPIO USB.</text>
<text x="625" y="917" font-size="18" fill="#475569" font-weight="400" text-anchor="start">The server cable goes into J1 on the Pico. Its native D+/D− are already wired</text>
<text x="625" y="942" font-size="18" fill="#475569" font-weight="400" text-anchor="start">on the board; do not connect them to GP12 / GP13. Use a data-capable cable.</text>
<text x="625" y="984" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">2. Target USB VBUS stays separate.</text>
<text x="625" y="1011" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Pico is powered from the server. Target +5 V is not a second Pico supply.</text>
<text x="625" y="1036" font-size="18" fill="#475569" font-weight="400" text-anchor="start">The shared connection between the computers here is signal GND, not +5 V.</text>
<text x="625" y="1078" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">3. This drawing uses the current fixed pull-up circuit.</text>
<text x="625" y="1105" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Keep the target USB port powered while R3 is tied to Pico 3.3 V.</text>
<text x="625" y="1130" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Automatic VBUS-dependent pull-up gating and data-line isolation are not shown.</text>
<text x="625" y="1172" font-size="20" fill="#172b3a" font-weight="700" text-anchor="start">4. Use a device-side connector.</text>
<text x="625" y="1199" font-size="18" fill="#475569" font-weight="400" text-anchor="start">J2 is a USB-B device breakout, connected to a normal USB-A host port.</text>
<text x="625" y="1224" font-size="18" fill="#475569" font-weight="400" text-anchor="start">Numbers on J2 are electrical pin IDs, not a mating-face orientation drawing.</text>
<text x="45" y="1255" font-size="16" fill="#52616d" font-weight="400" text-anchor="start">Pin reference: Raspberry Pi Pico 1 / Pico 2 official pinout · Firmware: pico-pio-usb / pico2-pio-usb</text>
</g></svg>
