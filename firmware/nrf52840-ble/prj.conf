# AnyKVM nRF52840 BLE HID firmware configuration.

# --- NCS sample defaults (enables ASSERT, LOG, HW_STACK_PROTECTION) ---
CONFIG_NCS_SAMPLES_DEFAULTS=y

# --- Bluetooth peripheral + HID over GATT (HoGP) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="AnyKVM"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_ATTR_MAX=30
# keyboard + mouse input reports (only one active report map at a time)
CONFIG_BT_HIDS_INPUT_REP_MAX=2
# iOS disconnects or ignores HID input without encrypted GATT attributes.
# CONFIG_BT_HIDS_DEFAULT_PERM_RW is not set
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_CONN_CTX=y
CONFIG_BT_L2CAP_TX_BUF_COUNT=5
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

# --- Bonding / security (iOS requires bonding for HID) ---
CONFIG_BT_SMP=y
# Headless dongle: allow Just Works pairing (no passkey UI on device).
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Multi-device: one BLE identity + bond slot per profile (see profiles.c).
# APP_PROFILE_COUNT identities are created at boot; keep MAX_PAIRED >= count.
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=4

# Low-latency HID: 7.5 ms connection interval (units of 1.25 ms).
# Default Zephyr pref is 24–40 (30–50 ms), which dominates mouse lag.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y

# --- USB CDC ACM serial (command channel from AnyKVM host) ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_PRODUCT="AnyKVM BLE HID"
CONFIG_UART_LINE_CTRL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y

# --- App tunables (see Kconfig) ---
CONFIG_APP_PROFILE_COUNT=4

# --- GPIO (LED status indicator) ---
CONFIG_GPIO=y

# --- System ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# CDC ACM carries AnyKVM binary frames only — no printk/log on this UART.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
