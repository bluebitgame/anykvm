<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AnyKVM</title>
<style>
  html, body { margin: 0; background: #111; color: #ddd; font-family: system-ui, sans-serif; height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  #picker { width: min(1120px, 100%); margin: 0 auto; padding: 24px; box-sizing: border-box; overflow: auto; }
  #pickerHeader { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  #pickerHeader h1 { margin: 0; font-size: 25px; }
  #settingsLink { margin-left: auto; color: #d8e5ff; text-decoration: none; border: 1px solid #52667f; border-radius: 6px; padding: 7px 12px; }
  #settingsLink:hover { background: #263546; }
  #targetGrid { display: grid; grid-template-columns: repeat(auto-fill, 320px); gap: 18px; }
  .targetCard { width: 320px; color: inherit; text-decoration: none; border: 1px solid #343b45; border-radius: 10px; overflow: hidden; background: #1a1e25; box-shadow: 0 2px 9px #0005; transition: transform .12s, border-color .12s; }
  .targetCard:hover, .targetCard:focus-visible { transform: translateY(-2px); border-color: #5793ff; outline: none; }
  .targetCard img { width: 100%; display: block; aspect-ratio: 920 / 430; object-fit: cover; background: #141c2b; }
  .targetCard span { display: block; padding: 11px 12px 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #targetEmpty { color: #aab3be; }
  #viewer { display: flex; flex: 1; min-height: 0; flex-direction: column; }
  @media (max-width: 380px) { #picker { padding: 16px; } #targetGrid { grid-template-columns: minmax(0, 1fr); } .targetCard { width: 100%; } }
  #bar { padding: 6px 10px; font-size: 13px; display: flex; flex-shrink: 0; gap: 12px; align-items: center; background: #1b1b1b; }
  #bar button { background: #2d6cdf; color: #fff; border: 0; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
  #bar button:disabled { background: #444; cursor: default; }
  #fullscreenNotice { color: #eaa; min-width: 0; }
  #bar #audioBtn, #bar #fullscreenBtn { background: transparent; color: #ddd; font-size: 20px; line-height: 1; padding: 4px 8px; }
  #bar #audioBtn:hover, #bar #fullscreenBtn:hover { background: #333; }
  #bar #audioBtn:disabled { opacity: 0.45; }
  #stat { color: #8a8; margin-left: auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #wrap { display: flex; align-items: center; justify-content: center; flex: 1; min-height: 0; }
  html[data-fullscreen-mode="video"] #bar { display: none; }
  canvas { max-width: 100%; max-height: 100%; flex-shrink: 0; transform-origin: center; background: #000; outline: none; touch-action: none; }
  #media { width: 100%; height: 100%; object-fit: contain; background: #000; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main id="picker">
    <div id="pickerHeader"><h1>AnyKVM</h1><a id="settingsLink" href="/settings/" hidden>Settings</a></div>
    <div id="targetGrid" aria-label="Targets"></div>
    <p id="targetEmpty" hidden>No targets are configured.</p>
  </main>
  <div id="viewer" hidden>
    <div id="bar">
      <strong id="targetTitle">AnyKVM</strong>
      <button id="audioBtn" type="button" title="Audio unavailable" aria-label="Audio unavailable" aria-pressed="false" disabled>🔈</button>
      <button id="fullscreenBtn" type="button" title="Enter fullscreen with toolbar" aria-label="Enter fullscreen with toolbar" aria-pressed="false" disabled>🔲</button>
      <span id="fullscreenNotice" role="status" hidden></span>
      <span id="stat">connecting…</span>
    </div>
    <div id="wrap"><canvas id="screen" width="640" height="480" tabindex="0"></canvas><video id="media" playsinline controls muted hidden></video></div>
  </div>
  <script src="/vendor/hls-1.7.3.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
