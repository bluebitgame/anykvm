name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  firmware-plan:
    name: Check firmware changes
    runs-on: ubuntu-22.04
    outputs:
      include: ${{ steps.changes.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check firmware change detection
        run: python -m unittest discover -s tools -p test_firmware_changes.py
      - name: Compare with previous published release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/firmware_changes.py

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            runner: ubuntu-22.04
            artifact: linux-amd64
          - target: linux/arm64
            runner: ubuntu-22.04
            artifact: linux-arm64
          - target: windows/amd64
            runner: windows-2022
            artifact: windows-amd64
          - target: windows/arm64
            runner: windows-2022
            artifact: windows-arm64
          - target: darwin/amd64
            runner: macos-15-intel
            artifact: darwin-amd64
          - target: darwin/arm64
            runner: macos-15
            artifact: darwin-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Linux build dependencies
        if: matrix.target == 'linux/amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libv4l-dev libasound2-dev
      - name: Check release packaging
        run: python -m unittest discover -s tools -p test_package_release.py
      - name: Check DMA-BUF header compatibility
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tools -p test_dma_buf_compat.py
      - name: Build with native media support
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python tools/build.py --targets "$BUILD_TARGET"
      - name: Require Windows audio runtime
        if: startsWith(matrix.target, 'windows/')
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: test -f "build/releases/$ARTIFACT/lib/opus.dll"
      - name: Package executable, runtime libraries and licenses
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: python tools/package_release.py --target "$BUILD_TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: anykvm-${{ matrix.artifact }}
          path: build/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  firmware:
    needs: firmware-plan
    if: needs.firmware-plan.outputs.include == 'true'
    name: Firmware ${{ matrix.group }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: pico1
            targets: pico pico-pio-usb pico-ps2
          - group: pico2
            targets: pico2 pico2-pio-usb pico2-ps2
          - group: rp2350-usb-a
            targets: rp2350-usb-a
          - group: nrf52840
            targets: nrf52840-xiao nrf52840-feather nrf52840-dongle
          - group: esp32s3-ble
            targets: esp32s3-ble
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install firmware build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git pkg-config libusb-1.0-0-dev device-tree-compiler gperf
      - name: Check firmware packaging
        run: python -m unittest discover -s tools -p test_package_firmware.py
      - name: Build firmware
        env:
          FIRMWARE_TARGETS: ${{ matrix.targets }}
        run: |
          read -ra targets <<< "$FIRMWARE_TARGETS"
          python tools/build_firmware.py --targets "${targets[@]}" --jobs 2
      - name: Package firmware and licenses
        env:
          FIRMWARE_GROUP: ${{ matrix.group }}
        run: python tools/package_firmware.py --group "$FIRMWARE_GROUP" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.group }}
          path: build/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish Release
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request' &&
      needs.firmware-plan.result == 'success' && needs.build.result == 'success' &&
      (needs.firmware.result == 'success' ||
       (needs.firmware-plan.outputs.include == 'false' && needs.firmware.result == 'skipped'))
    needs: [firmware-plan, build, firmware]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: anykvm-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: needs.firmware-plan.outputs.include == 'true'
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: Verify packages and collect checksums
        env:
          INCLUDE_FIRMWARE: ${{ needs.firmware-plan.outputs.include == 'true' }}
        working-directory: dist
        run: |
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            test -s "anykvm-$platform.tar.gz"
          done
          for platform in windows-amd64 windows-arm64; do
            test -s "anykvm-$platform.zip"
          done
          if [[ "$INCLUDE_FIRMWARE" == "true" ]]; then
            for board in pico1 pico2 rp2350-usb-a nrf52840 esp32s3-ble; do
              test -s "firmware-$board.zip"
            done
          fi
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          rm -- *.sha256
      - name: Upload assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          fi
